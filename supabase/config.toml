[db.seed]
# يُشغَّل تلقائيًا فقط ما يجعل النظام "نظامًا".
#
# supabase/seeds/01_system/ يحوي الصفوف التي لا يعمل النظام بدونه:
#   * 01_modules            — التطبيق يقرأ هذه الأكواد لتحديد الشاشات المتاحة
#   * 02_plans              — باقات الاشتراك
#   * 03_chart_of_accounts  — محرّك الترحيل يحلّ أكوادًا مثل '4111'
#   * 04_units              — كل منتج يحمل وحدة
#   * 05_expense_categories — نموذج المصروف يشترط تصنيفًا، مربوطة بحساباتها
#   * 06_platform_admins     — بلا مسؤول منصة لا تُدار الباقات ولا الوحدات
#
# ممنوع أن يحوي هذا المسار بيانات أعمال أو هوية شركة:
#   * بيانات الأعمال (منتجات، عملاء، موردون، فواتير، مخزون) = قيود مُختلقة
#     داخل دفاتر العميل
#   * company_settings = الكتابة على اسم العميل وعملته ورقمه الضريبي
#
# استثناء مقصود: 06_platform_admins يُنشئ صفوف auth.users حقيقية. هذا مبرَّر
# لأنه حساب **المنصة** لا حساب عميل: وجوده شرط لعمل اللوحة الإدارية، وهو
# نفسه في كل نسخة للنظام. حسابات المتجر تبقى ممنوعة تمامًا هنا — يملكها
# العميل وتُبنى من التطبيق.
#
# ملاحظة: جدول packaging_types يبدأ فارغًا عن قصد. «شوال» و«كيس» لا يحملان
# وزنًا ولا يصفان شيئًا يحتاجه كل عميل، والمنتج الحقيقي هو «كيس 50 كجم».
#
# ملفات العيّنات اختيارية وخارج هذا المسار:
#   supabase/seeds/02_company/  — هوية العميل وأرصدته الافتتاحية
#   supabase/seeds/03_samples/  — بيانات عرض لكل نشاط (مطحنة…)
#   supabase/seeds/04_tests/    — مثبتات الاختبارات الآلية
# راجع supabase/seeds/README.md و supabase/MIGRATIONS_RULES.md.
enabled = true
sql_paths = ["./seeds/01_system/*.sql"]

# ---------------------------------------------------------------------------
# Edge Functions
# ---------------------------------------------------------------------------
# admin-create-user provisions store staff accounts (Auth user + profile +
# store role) through the Supabase Admin API. That API requires a secret key
# which must never reach the browser, so this function is the only place the
# key is used.
#
# verify_jwt = true -> calls without a bearer token are rejected by the
# platform before the function body runs. The function additionally re-derives
# the caller's permissions from the database, so a valid token alone is never
# sufficient to create a user.
[functions.admin-create-user]
verify_jwt = true

# ---------------------------------------------------------------------------
# Auth — الدخول بالبريد وبالهاتف
# ---------------------------------------------------------------------------
# تفعيل قسم الهاتف يسمح بـ signInWithPassword بالهاتف مباشرةً لدى GoTrue،
# بدل الاعتماد على البريد الوهمي (967771234567@vortex.local) الذي كان
# الطريق الوحيد قبل ذلك. الفرق:
#
#   بالبريد الوهمي : حساب واحد ببريد صناعي، والدخول بالهاتف يعمل لأن
#                    الواجهة تحوّل الرقم إلى ذلك البريد قبل الإرسال.
#   بالهاتف الحقيقي: الهاتف حقل مصادقة مستقل لدى GoTrue، فيعمل الدخول برقم
#                    الهاتف حقيقةً، ويبقى البريد الحقيقي يعمل في الوقت نفسه.
#                    ويمكن إرسال OTP لاحقًا بلا تغيير في المخطط.
#
# إرسال SMS معطّل عمدًا: لا مزوّد رسائل في بيئة التطوير، ورسائل حقيقية
# تستهلك رصيدًا وتحتاج موافقة. الـ OTP يُطبع في سجلّ حاوية auth بدل إرساله،
# وهو كافٍ تمامًا محليًا.
[auth]
enable_signup = true

# المفتاح الذي يُنتج GOTRUE_EXTERNAL_PHONE_ENABLED=true. بدونه يبقى الهاتف
# معطّلًا حتى لو كان قسم [auth.sms] مضبوطًا — وهو ما حدث أول مرة: الإعداد
# وصل ولم يُفعَّل الهاتف، لأن هذا المفتاح هو وحده ما يفتح الباب.
enable_phone = true

[auth.sms]
# تسجيل الدخول بكلمة مرور أو OTP عبر الهاتف.
enable_signup = true
enable_confirmations = false
# ⚠️ بلا مزوّد SMS تُطبع الرموز في سجل الحاوية لا تُرسل. للتطوير فقط.
# قبل النشر لعميل: اربط مزوّدًا حقيقيًا في لوحة Supabase، أو اجعلها false.
template = "رمز الدخول الخاص بك: {{ .Code }}"

# ── مزوّد SMS ────────────────────────────────────────────────────────────────
# CLI 2.120 يشترط مزوّدًا مُعلنًا هنا، وإلا طبع «WARN: no SMS provider is
# enabled» وأعطّل الدخول بالهاتف بلا نظر إلى enable_phone. هذا مفاجئ: المفتاح
# وحده لا يكفي.
#
# البيانات أدناه **قيم تطوير وهمية**، لا مفاتيح حقيقية. لا تُرسل أي رسالة:
# sms_autoconfirm مفعّل افتراضيًا في البيئة المحلية، فتأكيد الهاتف ينجح مباشرةً
# بلا إرسال. الحقول مطلوبة فقط لإسكات الشرط وتفعيل القسم.
#
# ⚠️ قبل النشر لعميل: ضع بيانات مزوّد حقيقي (Twilio/MessageBird/Vonage) في
# لوحة Supabase، أو اجعل enable_phone = false.
[auth.sms.twilio]
# enabled = true إلزامي لإسكات التحذير وتفعيل الدخول بالهاتف، حتى بلا إرسال
# فعلي. الشرط في شيفرة CLI حرفي: إن لم يوجد مزوّد **مُفعّل** (twilio أو
# twilio_verify أو messagebird أو textlocal أو vonage) فسيُعطّل الهاتف، مها
# كان enable_phone. فالمنطق: «لا مزوّد ⇒ لا هاتف».
enabled = true
account_sid = "placeholder"
auth_token = "placeholder"
message_service_sid = "placeholder"
