services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?Set VITE_SUPABASE_URL in deploy/.env.local-production}
        VITE_SUPABASE_TARGET: ${VITE_SUPABASE_TARGET:?Set VITE_SUPABASE_TARGET to docker or cloud}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:?Set VITE_SUPABASE_PUBLISHABLE_KEY in deploy/.env.local-production}
    restart: unless-stopped
    env_file:
      - .env.local-production
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      VITE_SUPABASE_TARGET: ${VITE_SUPABASE_TARGET:?Set VITE_SUPABASE_TARGET to docker or cloud}
      SUPABASE_TARGET: ${SUPABASE_TARGET:?Set SUPABASE_TARGET to docker or cloud}
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL in deploy/.env.local-production}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-${VITE_SUPABASE_PUBLISHABLE_KEY:?Set a Supabase publishable key}}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:?Set the server-only Supabase secret key}}
    expose:
      - "3000"
    networks:
      - app_private
      - supabase_backend
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  app_private:
  # The official self-hosted Supabase Compose project creates this network
  # from its top-level `name: supabase`. The app only reaches the API gateway.
  supabase_backend:
    external: true
    name: supabase_default
